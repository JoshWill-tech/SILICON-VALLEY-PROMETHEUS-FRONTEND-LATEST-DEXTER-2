name: Source upload regression

on:
  pull_request:
    paths:
      - 'app/editor/**'
      - 'app/api/projects/**/upload-multipart/**'
      - 'app/api/projects/**/exports/**'
      - 'components/editor/editorial-delivery-studio.tsx'
      - 'hooks/use-voice-companion.ts'
      - 'lib/projects/**'
      - 'lib/exports/**'
      - 'lib/server/mini-run*.ts'
      - 'lib/voice-companion/**'
      - 'lib/editor/render-delivery.ts'
      - 'app/api/user/storage/cleanup/**'
      - 'lib/api/source-control-plane-errors.ts'
      - 'lib/r2/**'
      - 'lib/storage-limits.ts'
      - 'supabase/migrations/**'
      - 'tests/source-replacement-upload.test.ts'
      - 'tests/multipart-upload-runtime.test.ts'
      - 'tests/source-upload-quota-handlers.test.ts'
      - 'tests/jarvis-source-registration.test.ts'
      - 'tests/jarvis-render-receipts.test.ts'
      - 'tests/jarvis-end-to-end-session.test.mjs'
      - 'tests/jarvis-mp4-session.test.mjs'
      - 'tests/source-render-readiness.test.ts'
      - 'tests/project-lifecycle-services.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/source-upload-regression.yml'
  push:
    branches: [main]
    paths:
      - 'app/editor/**'
      - 'app/api/projects/**/upload-multipart/**'
      - 'app/api/projects/**/exports/**'
      - 'components/editor/editorial-delivery-studio.tsx'
      - 'hooks/use-voice-companion.ts'
      - 'lib/projects/**'
      - 'lib/exports/**'
      - 'lib/server/mini-run*.ts'
      - 'lib/voice-companion/**'
      - 'lib/editor/render-delivery.ts'
      - 'app/api/user/storage/cleanup/**'
      - 'lib/api/source-control-plane-errors.ts'
      - 'lib/r2/**'
      - 'lib/storage-limits.ts'
      - 'supabase/migrations/**'
      - 'tests/source-replacement-upload.test.ts'
      - 'tests/multipart-upload-runtime.test.ts'
      - 'tests/source-upload-quota-handlers.test.ts'
      - 'tests/jarvis-source-registration.test.ts'
      - 'tests/jarvis-render-receipts.test.ts'
      - 'tests/jarvis-end-to-end-session.test.mjs'
      - 'tests/jarvis-mp4-session.test.mjs'
      - 'tests/source-render-readiness.test.ts'
      - 'tests/project-lifecycle-services.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/source-upload-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:source-upload
      - run: npm run test:jarvis-render
